
name: Build IDT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -o IDT_Updated_Android_Project.zip -d extracted

      - name: Find project folder
        run: |
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          chmod +x extracted/IDT_Updated_Android_Project/gradlew
          cd extracted/IDT_Updated_Android_Project
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Installation-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
